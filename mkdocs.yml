# Documentation configuration for stacktower-docker.

INHERIT: .mkdocs-shared/shared/mkdocs.base.yml

site_name: 'Stacktower (Docker)'
site_description: 'Docker web interface for the CLI tool "Stacktower" that renders package dependencies as physical tower structures. Supports PyPI, npm, crates.io, Packagist, and RubyGems.'
site_author: willtheorangeguy
site_url: https://williamvdg.me/stacktower-docker/docs/

repo_url: https://github.com/willtheorangeguy/stacktower-docker
repo_name: willtheorangeguy/stacktower-docker
edit_uri: edit/main/docs/

copyright: Copyright &copy; willtheorangeguy

nav:
  - Home: index.md
  - 'Quickstart': 'quickstart.md'
  - 'Installation': 'installation.md'
  - 'Usage': 'usage.md'
  - 'Configuration': 'configuration.md'
  - 'Architecture': 'architecture.md'
  - 'API': 'api.md'
  - 'Development': 'development.md'
  - 'FAQ': 'faq.md'
  - 'Troubleshooting': 'troubleshooting.md'
  - 'Roadmap': 'roadmap.md'
  - 'stacktower-docker': 'internal/known-issues.md'
  - License: license.md
  - Contributing: https://github.com/willtheorangeguy/.github/blob/main/CONTRIBUTING.md
  - Code of Conduct: https://github.com/willtheorangeguy/.github/blob/main/CODE_OF_CONDUCT.md
  - Security: https://github.com/willtheorangeguy/.github/blob/main/SECURITY.md

exclude_docs: |
  docs.instructions.md